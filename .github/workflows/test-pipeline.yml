name: Test pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick espeak-ng fonts-dejavu-core
          python -m pip install -e '.[test]'
          npm ci
      - run: npm run typecheck
      - run: video-factory doctor
      - run: python -m pytest -q
      - name: Render example (CPU draft, no external APIs)
        run: |
          video-factory render videos/example --preset draft --no-keep-intermediates
          video-factory validate videos/example
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-and-diagnostics
          path: videos/example/output/
          retention-days: 3
