# عرض سريع لحركة الكاميرا العمقية (v-creator animate) على صورتين من المشاهد.
# الاستعمال:
#   .venv/bin/v-creator animate FF/animate-demo.yaml --preview --out output/animate-demo
# المواصفة الكاملة للفيلم: FF/ghost-hassan.yaml
video:
  id: jubb-hassan-animate-demo
  title: "شبح جُبّ حسن الصغير — عرض الحركة العمقية"
  width: 1920
  height: 1080
  fps: 24
  seed: 2048

audio:
  narration:
    required: false
  music:
    mode: procedural
    mood: mysterious
    bpm: 68

scenes:
