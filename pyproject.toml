[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "video-factory"
version = "0.1.0"
description = "Local CPU-first, explainable video production studio"
requires-python = ">=3.11"
dependencies = ["pydantic==2.11.7", "PyYAML==6.0.2", "Pillow==11.3.0", "numpy==2.2.6"]
[project.optional-dependencies]
test = ["pytest==8.4.1"]
moviepy = ["moviepy==2.2.1"]
manim = ["manim==0.19.0"]
[project.scripts]
video-factory = "video_factory.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: CPU render requiring ffmpeg and ffprobe"]
